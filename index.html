<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BoltHouse — Bolts, Screws, Nuts & Washers</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2229;--mut:#5d6672;--line:#e1ded7;--acc:#d9480f;--on:#fff;--ok:#2b8a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--ink:#eceae4;--mut:#9aa3ad;--line:#2d333b;--acc:#ff7a3d;--on:#14171b;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--ink:#eceae4;--mut:#9aa3ad;--line:#2d333b;--acc:#ff7a3d;--on:#14171b;--ok:#69db7c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
.cartbtn{background:var(--ink);color:var(--bg);padding:8px 14px;font-weight:600}
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(28px,5.5vw,46px);line-height:1.05;margin:0 0 10px;letter-spacing:-1.5px}
.hero p{color:var(--mut);margin:0 0 14px;max-width:520px}
.perks{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.perks span{border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.bar{display:flex;flex-direction:column;gap:15px;margin:16px 0;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(29,34,41,.045)}
.fr{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.fr label{font-size:11px;font-weight:750;letter-spacing:.075em;text-transform:uppercase;color:var(--mut);min-width:0;padding:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:36px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
.chip:hover:not(.on){background:var(--bg);border-color:var(--acc)}
.chip:active{transform:scale(.98)}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.chip:focus-visible,.clr:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.clr{display:inline-flex;align-items:center;align-self:flex-start;background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:8px;text-decoration:none;padding:7px 11px;font-size:12px;font-weight:650;transition:color .15s ease,border-color .15s ease}
.clr:hover{color:var(--acc);border-color:var(--acc)}
@media(max-width:560px){.bar{gap:14px;padding:15px 13px;border-radius:13px}.fr{grid-template-columns:1fr;gap:7px}.fr label{font-size:10px}.chips{gap:7px}.chip{min-height:35px;padding:7px 11px;font-size:12px}}
.cnt{color:var(--mut);font-size:14px;margin-bottom:8px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
.it svg{width:44px;height:44px;color:var(--mut);flex:none}
.nm{flex:1 1 170px;min-width:0}
.meta{font-size:13px;color:var(--mut)}
.price{font-weight:700;min-width:96px;text-align:right}.price small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.qi{width:68px;text-align:center}
.add{background:var(--acc);color:var(--on);padding:8px 14px;font-weight:600;min-width:74px}
.more{display:block;margin:0 auto 36px;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 22px}
.empty{color:var(--mut);padding:30px 0}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--mut);font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
.ov.open{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overflow:auto}
.drawer h2{margin:0}
.line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{background:var(--card);color:var(--ink);border:1px solid var(--line);width:30px;height:32px}
.qty input{width:64px;text-align:center;padding:5px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:auto}
.go{background:var(--acc);color:var(--on);padding:12px;font-weight:700;width:100%}
.x{background:none;color:var(--mut);float:right;font-size:22px}
.f{display:flex;flex-direction:column;gap:8px}
.ok{color:var(--ok);font-weight:600}

.filter-row-c .chip{min-height:38px;padding:8px 15px;font-weight:700}
.filter-row-m .chip{min-width:82px}
.filter-row-s .chip,.filter-row-l .chip{font-variant-numeric:tabular-nums}
.fr:not(:first-child){border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding-top:13px}
.clr{margin-top:1px}
</style>
</head>
<body>
<header><div class="w"><div class="logo"><span id="store-name-first">Bolt</span><b id="store-name-last">House</b> 🔩</div><button class="cartbtn" id="cb">Cart (<span id="cn">0</span>)</button></div></header>
<main class="w">
<section class="hero">
<h1 id="store-hero-title">Bolts, screws, nuts &amp; washers.</h1>
<p id="store-hero-description">Metric M3 to M20. Buy a single piece or hundreds — you choose the quantity.</p>
<div class="perks" id="store-perks"><span>Sold per piece</span><span>M3 – M20</span><span>Bulk quotes available</span></div>
</section>
<div class="bar" id="bar"></div>
<div class="cnt" id="cnt"></div>
<div class="list" id="grid"></div>
<button class="more" id="more" data-k="more">Show more</button>
</main>
<footer><div class="w">© <span id="footer-store-name">BoltHouse</span> · <a href="./admin.html" id="adm" style="color:inherit">Admin</a></div></footer>
<div class="ov" id="ov"><div class="drawer" id="dr"></div></div>

<script src="config.js?v=5f34b5d"></script>
<script type="module">
import {CFG,api,fetchAll} from "./api.js";
let LOADERR=0,ROWS=[],CATS={},SZ=[],LN=[],ITEMS=[],byId={};
function build(rows){
ROWS=rows;CATS={};ROWS.forEach(r=>{const a=CATS[r[0]]=CATS[r[0]]||[];if(!a.includes(r[1]))a.push(r[1])});
SZ=[...new Set(ROWS.map(r=>r[2]))].sort((a,b)=>a-b);
LN=[...new Set(ROWS.map(r=>r[3]).filter(Boolean))].sort((a,b)=>a-b);
ITEMS=ROWS.map(r=>{const material=r[5]==="stainless_steel"?"stainless_steel":"steel";const base=(r[1]+"_"+r[2]+"_"+r[3]).replace(/\W/g,"_");return {id:base+(material==="steel"?"":"_"+material),c:r[0],t:r[1],d:r[2],l:r[3],p:r[4],m:material}});
byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
}
async function loadCatalog(){
LOADERR=0;
try{
 let rows;
 try{rows=await fetchAll("products?select=category,type,size,length,price,material&in_stock=eq.true&order=category,type,size,length,material")}
 catch(e){rows=(await fetchAll("products?select=category,type,size,length,price&in_stock=eq.true&order=category,type,size,length")).map(r=>({...r,material:"steel"}))}
 build(rows.map(r=>[r.category,r.type,r.size,r.length,+r.price,r.material||"steel"]));
}catch(e){LOADERR=1}
}
if(CFG.SUPABASE_URL)await loadCatalog();else LOADERR=1;
const $=id=>document.getElementById(id);
// Escape all catalog/user-controlled strings before inserting them into HTML templates.
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" EGP";
const getWhatsapp=()=>String(window.BH_SETTINGS?.whatsapp||CFG.WHATSAPP||"");
const getStoreName=()=>String(window.BH_SETTINGS?.store_name||"BoltHouse");
async function loadStoreSettings(){
try{
const rows=await api("site_settings?select=store_name,hero_title,hero_description,perk_one,perk_two,perk_three,whatsapp&id=eq.true");
if(!Array.isArray(rows)||!rows.length)return;
const s=rows[0];
window.BH_SETTINGS=s;
const name=String(s.store_name||"BoltHouse").trim()||"BoltHouse";
const split=Math.min(name.length,Math.max(1,Math.floor(name.length*4/9)));
$("store-name-first").textContent=name.slice(0,split);
$("store-name-last").textContent=name.slice(split);
$("footer-store-name").textContent=name;
$("store-hero-title").textContent=s.hero_title||"Bolts, screws, nuts & washers.";
$("store-hero-description").textContent=s.hero_description||"Metric M3 to M20. Buy a single piece or hundreds — you choose the quantity.";
const perks=$("store-perks");
perks.replaceChildren();
[s.perk_one,s.perk_two,s.perk_three].filter(v=>typeof v==="string"&&v.trim()).forEach(label=>{const span=document.createElement("span");span.textContent=label;perks.appendChild(span)});
document.title=name+" — Bolts, Screws, Nuts & Washers";
}catch(e){/* Use built-in storefront defaults if settings are not configured yet. */}
}
let cart={},F={c:[],t:[],m:[],s:[],l:[]},shown=30;
try{cart=JSON.parse(localStorage.getItem("bh-cart2")||"{}")}catch(e){cart={}}
// localStorage is user-controlled: retain only known products and positive integer quantities.
if(!cart || typeof cart!=="object" || Array.isArray(cart))cart={};
for(const [k,n] of Object.entries(cart)){
  if(!byId[k] || !Number.isSafeInteger(n) || n<1)delete cart[k];
}
const save=()=>{try{localStorage.setItem("bh-cart2",JSON.stringify(cart))}catch(e){}};
const count=()=>Object.keys(cart).length;
const total=()=>Object.entries(cart).reduce((a,[id,n])=>a+byId[id].p*n,0);
const has=(a,v)=>!a.length||a.includes(v);
function ic(i){
 const c="currentColor", bg="var(--bg)", t=i.t||"";
 if(i.c=="nut")return '<svg viewBox="0 0 60 60" aria-hidden="true"><polygon points="30,5 49,16 49,38 30,49 11,38 11,16" fill="'+c+'" fill-opacity=".13" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/><path d="M30 5 L30 14 M49 16 L41 21 M49 38 L41 33 M30 49 L30 40 M11 38 L19 33 M11 16 L19 21" stroke="'+c+'" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/><circle cx="30" cy="27" r="11" fill="'+bg+'" stroke="'+c+'" stroke-width="2"/><circle cx="30" cy="27" r="7" fill="'+c+'" fill-opacity=".08" stroke="'+c+'" stroke-opacity=".35" stroke-width="1.2"/><path d="M24 21 A8.5 8.5 0 0 1 36 21" fill="none" stroke="'+c+'" stroke-opacity=".4" stroke-width="1.4"/></svg>';
 if(i.c=="washer"){
  if(/Spring/i.test(t))return '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="20" fill="'+c+'" fill-opacity=".12"/><circle cx="30" cy="30" r="11" fill="'+bg+'"/><path d="M44.2 16.5 A20 20 0 1 0 44.2 43.5" fill="none" stroke="'+c+'" stroke-width="3.4" stroke-linecap="round"/><path d="M44 16 L38 19 M44 44 L38 41" stroke="'+c+'" stroke-width="3.4" stroke-linecap="round"/><path d="M17 17 A18 18 0 0 1 39 12" fill="none" stroke="'+c+'" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/></svg>';
  return '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="23" fill="'+c+'" fill-opacity=".12" stroke="'+c+'" stroke-width="1.8"/><circle cx="30" cy="30" r="16" fill="'+bg+'" stroke="'+c+'" stroke-opacity=".8" stroke-width="1.8"/><path d="M15 17 A21 21 0 0 1 39 10" fill="none" stroke="'+c+'" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/><path d="M13 37 A18 18 0 0 0 22 46" fill="none" stroke="'+c+'" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/></svg>';
 }
 const g=/Grub/i.test(t), socket=/Socket/i.test(t), pan=/Button|Pan/i.test(t), counter=/Counter/i.test(t);
 let head="";
 if(socket) head='<rect x="4" y="14" width="16" height="32" rx="3" fill="'+c+'" fill-opacity=".17" stroke="'+c+'" stroke-width="1.8"/><path d="M7 17 L17 17 M7 43 L17 43" stroke="'+c+'" stroke-opacity=".55" stroke-width="1.5"/><ellipse cx="10" cy="30" rx="4" ry="7" fill="'+bg+'" stroke="'+c+'" stroke-width="1.5"/><path d="M7.5 27.5 L12.5 32.5 M12.5 27.5 L7.5 32.5" stroke="'+c+'" stroke-width="1.2" stroke-linecap="round"/>';
 else if(pan) head='<path d="M17 24 C17 18 13 14 9 14 C5 14 2.5 18 2.5 23 L2.5 36 C2.5 40 5 42 9 42 C13 42 17 38 17 32 Z" fill="'+c+'" fill-opacity=".17" stroke="'+c+'" stroke-width="1.8"/><path d="M5 21 C6 17 9 16 12 17" fill="none" stroke="'+c+'" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/><path d="M7 25 L11 31 M11 25 L7 31" fill="none" stroke="'+c+'" stroke-width="1.4" stroke-linecap="round"/>';
 else if(counter) head='<path d="M3 14 L21 24 L21 36 L3 46 Z" fill="'+c+'" fill-opacity=".16" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 17 L18 25" stroke="'+c+'" stroke-opacity=".5" stroke-width="1.4"/>';
 else if(!g) head='<path d="M3 18 L8 12 L17 12 L22 18 L22 36 L17 42 L8 42 L3 36 Z" fill="'+c+'" fill-opacity=".17" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 14 L17 14 M5 20 L5 34 M8 40 L17 40" fill="none" stroke="'+c+'" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>';
 const x=g?7:(socket?17:(pan?13:counter?18:20));
 let threads="";
 for(let z=x+4;z<54;z+=4)threads+='<path d="M'+z+' 23 L'+(z-4)+' 37" stroke="'+c+'" stroke-opacity=".72" stroke-width="1.4" stroke-linecap="round"/>';
 const shank='<path d="M'+x+' 24 L55 24 L58 27 L58 33 L55 36 L'+x+' 36 Z" fill="'+c+'" fill-opacity=".12" stroke="'+c+'" stroke-width="1.8" stroke-linejoin="round"/><path d="M'+(x+2)+' 26 L54 26" stroke="'+c+'" stroke-opacity=".42" stroke-width="1.3" stroke-linecap="round"/>'+threads;
 if(g)return '<svg viewBox="0 0 60 60" aria-hidden="true">'+shank+'<path d="M12 24 L12 36" stroke="'+c+'" stroke-width="1.7"/><path d="M15 27 L19 30 L15 33" fill="none" stroke="'+c+'" stroke-width="1.3"/></svg>';
 return '<svg viewBox="0 0 60 60" aria-hidden="true">'+shank+head+'<path d="M'+(x+1)+' 36 L'+(x+1)+' 24" stroke="'+c+'" stroke-opacity=".45" stroke-width="1.2"/></svg>';
}
function bar(){
const matches=(i,skip)=>["c","t","m","s","l"].every(k=>k===skip||!F[k].length||F[k].includes(({c:i.c,t:i.t,m:i.m,s:i.d,l:i.l})[k]));
const available=k=>[...new Set(ITEMS.filter(i=>matches(i,k)).map(i=>({c:i.c,t:i.t,m:i.m,s:i.d,l:i.l})[k]).filter(v=>v!==null&&v!==undefined&&v!==""))].sort((a,b)=>{
 if(typeof a==="number"&&typeof b==="number")return a-b;
 if(k==="m")return (a==="steel"?0:1)-(b==="steel"?0:1);
 return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:"base"});
});
const categoryOrder=["bolt","screw","nut","washer"];
const existingCats=[...new Set(ITEMS.map(i=>i.c))];
const cats=categoryOrder.filter(c=>existingCats.includes(c)).concat(existingCats.filter(c=>!categoryOrder.includes(c)).sort((a,b)=>a.localeCompare(b)));
const types=available("t"),materials=available("m"),sizes=available("s"),lengths=available("l");
F.c=F.c.filter(v=>cats.includes(v));
F.t=F.t.filter(v=>types.includes(v));
F.m=F.m.filter(v=>materials.includes(v));
F.s=F.s.filter(v=>sizes.includes(v));
F.l=F.l.filter(v=>lengths.includes(v));
const row=(k,lab,vals,f)=>vals.length?`<div class="fr filter-row filter-row-${esc(k)}"><label>${esc(lab)}</label><div class="chips"><button class="chip ${F[k].length?"":"on"}" aria-pressed="${F[k].length?"false":"true"}" data-k="${esc(k)}" data-v="*">All</button>${vals.map(v=>`<button class="chip ${F[k].includes(v)?"on":""}" aria-pressed="${F[k].includes(v)?"true":"false"}" data-k="${esc(k)}" data-v="${esc(v)}">${esc(f?f(v):v)}</button>`).join("")}</div></div>`:"";
$("bar").innerHTML=row("c","Category",cats,v=>v[0].toUpperCase()+v.slice(1)+"s")+
 row("m","Material",materials,v=>v==="stainless_steel"?"Stainless steel":"Steel")+
 row("t","Type",types)+
 row("s","Size",sizes,v=>"M"+v)+
 row("l","Length",lengths,v=>v+" mm")+
 '<button class="clr" data-k="clr">Clear filters</button>';
}
function grid(){
const L=ITEMS.filter(i=>has(F.c,i.c)&&has(F.t,i.t)&&has(F.m,i.m)&&has(F.s,i.d)&&has(F.l,i.l));
$("cnt").textContent=L.length+" items";
$("grid").innerHTML=L.slice(0,shown).map(i=>`<div class="it">${ic(i)}<div class="nm"><b>${esc(i.t)} M${esc(i.d)}${i.l?"×"+esc(i.l):""}</b><div class="meta">${i.m==="stainless_steel"?"Stainless steel":"Steel"} · Size M${esc(i.d)}${i.l?" · Length "+esc(i.l)+" mm":""}</div></div><div class="price">${fm(i.p)}<small>per piece</small></div><input class="qi" type="number" min="1" step="1" value="1" id="q${esc(i.id)}" aria-label="Quantity"><button class="add" data-a="${esc(i.id)}">Add</button></div>`).join("")||(LOADERR?'<div class="empty">The catalogue is not available right now. <a href="https://wa.me/'+esc(getWhatsapp().replace(/\D/g,""))+'?text='+encodeURIComponent("Hello " + getStoreName() + ", please send me the product catalogue.")+'" target="_blank" rel="noopener">Ask for the catalogue on WhatsApp</a>.</div>':'<div class="empty">No items match those filters.</div>');
$("more").style.display=L.length>shown?"block":"none";
}
function drawer(view){
$("cn").textContent=count();
let h='<button class="x" data-c="close">×</button>';
if(view=="co"){
h+=`<h2>Checkout</h2><div class="f"><input id="nm" placeholder="Full name"><input id="ph" placeholder="Phone"><input id="ad" placeholder="Delivery address"></div><div class="tot"><span>Total</span><span>${fm(total())}</span></div><p id="er" style="color:var(--acc);margin:0"></p><button class="go" data-c="place">Place order</button>`;
}else if(view=="done"){
const wa=getWhatsapp()&&LAST?`<a class="go" style="display:block;text-align:center;text-decoration:none;border-radius:8px;margin-bottom:8px" target="_blank" rel="noopener" href="https://wa.me/${getWhatsapp().replace(/\D/g,"")}?text=${encodeURIComponent(waText(LAST))}">Send order on WhatsApp</a>`:"";
h+=`<h2 class="ok">Order ${ORDER_SAVED?"received":"ready"} ✓</h2><p>${ORDER_SAVED?"Thanks! We'll contact you to confirm delivery.":"Your order has not been submitted yet. Tap below to send it to us on WhatsApp."}</p>${wa}<button class="go" data-c="close">Keep shopping</button>`;
}else{
const e=Object.entries(cart);
h+=`<h2>Your cart</h2>`+(e.length?e.map(([id,n])=>{const i=byId[id];return `<div class="line"><div><b>${esc(i.t)} M${esc(i.d)}${i.l?"×"+esc(i.l):""}</b><div class="meta">${i.m==="stainless_steel"?"Stainless steel":"Steel"} · ${fm(i.p)} per piece</div><div class="qty"><button data-m="${esc(id)}" aria-label="Decrease quantity">−</button><input type="number" min="1" step="1" value="${n}" data-qi="${esc(id)}" aria-label="Quantity"><button data-pl="${esc(id)}" aria-label="Increase quantity">+</button></div></div><b>${fm(i.p*n)}</b></div>`}).join("")+`<div class="tot"><span>Total</span><span>${fm(total())}</span></div><button class="go" data-c="co">Checkout</button>`:'<p class="empty">Your cart is empty.</p>');
}
$("dr").innerHTML=h;
}
const open=v=>{$("ov").classList.add("open");drawer(v)};
document.addEventListener("click",e=>{
const b=e.target.closest("button");
if(e.target.id=="ov")$("ov").classList.remove("open");
if(!b)return;
const d=b.dataset;
if(d.k=="clr"){F={c:[],t:[],m:[],s:[],l:[]};shown=30;bar();grid()}
else if(d.k=="more"){shown+=30;grid()}
else if(d.k){if(d.v=="*")F[d.k]=[];else{const v=(d.k=="s"||d.k=="l")?+d.v:d.v,a=F[d.k],i=a.indexOf(v);if(d.k=="l")i<0?a.push(v):a.splice(i,1);else F[d.k]=i<0?[v]:[]}shown=30;bar();grid()}
if(d.a && byId[d.a]){const n=Math.max(1,Math.min(100000,parseInt($("q"+d.a)?.value,10)||1));cart[d.a]=Math.min(100000,(cart[d.a]||0)+n);save();$("cn").textContent=count();b.textContent="Added ✓";setTimeout(()=>b.textContent="Add",900)}
if(d.pl && byId[d.pl]){cart[d.pl]=Math.min(100000,(cart[d.pl]||0)+1);save();drawer()}
if(d.m){if(--cart[d.m]<=0)delete cart[d.m];save();drawer()}
if(d.c=="close")$("ov").classList.remove("open");
if(d.c=="co")drawer("co");
if(d.c=="place")placeOrder(b);
});
document.addEventListener("change",e=>{
const id=e.target.dataset.qi;if(!id)return;
const n=parseInt(e.target.value,10)||0;
if(!byId[id] || n<1)delete cart[id];else cart[id]=Math.min(100000,n);
save();drawer();
});
const lab=i=>`${i.m==="stainless_steel"?"Stainless steel":"Steel"} ${i.t} M${i.d}${i.l?"×"+i.l:""}`;
const waText=o=>`Order ${o.id}\n`+o.items.map(i=>`${i.qty} × ${i.name} = ${fm(i.qty*i.price)}`).join("\n")+`\nTotal: ${fm(o.total)}\nName: ${o.name}\nPhone: ${o.phone}\nAddress: ${o.address}`;
let LAST=null,ORDER_SAVED=false;
async function placeOrder(b){
if(!Object.keys(cart).length){$("er").textContent="Your cart is empty.";return}
const o={id:"BH"+Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),name:$("nm").value.trim(),phone:$("ph").value.trim(),address:$("ad").value.trim(),total:total(),items:Object.entries(cart).filter(([id,n])=>byId[id] && Number.isSafeInteger(n) && n>0).map(([id,n])=>({name:lab(byId[id]),qty:n,price:byId[id].p}))};
if(!o.items.length){$("er").textContent="Your cart is empty. Please add an item first.";return}
if(!o.name||!o.phone||!o.address){$("nm").focus();return}
if(!CFG.SUPABASE_URL&&!getWhatsapp()){$("er").textContent="Ordering is not set up yet.";return}
b.disabled=true;b.textContent="Sending…";
ORDER_SAVED=false;
if(CFG.SUPABASE_URL){try{await api("orders",{method:"POST",body:{ref:o.id,name:o.name,phone:o.phone,address:o.address,items:o.items,total:o.total},prefer:"return=minimal"});ORDER_SAVED=true}catch(e){if(!getWhatsapp()){b.disabled=false;b.textContent="Place order";$("er").textContent="Could not send the order. Please try again.";return}}}
LAST=o;cart={};save();drawer("done");
}
window.BH={reload:async()=>{await loadCatalog();F={c:[],t:[],m:[],s:[],l:[]};for(const k in cart)if(!byId[k])delete cart[k];save();$("cn").textContent=count();bar();grid()}};
$("adm").href="./admin.html";
$("cb").onclick=()=>open();
if(CFG.SUPABASE_URL)await loadStoreSettings();
bar();grid();$("cn").textContent=count();
</script>
</body>
</html>
