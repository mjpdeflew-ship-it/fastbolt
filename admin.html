<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>BoltHouse Admin</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2229;--mut:#5d6672;--line:#e1ded7;--acc:#d9480f;--on:#fff;--ok:#2b8a3e;--warn:#9a6700;--shadow:0 12px 35px rgba(29,34,41,.07}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--ink:#eceae4;--mut:#9aa3ad;--line:#2d333b;--acc:#ff7a3d;--on:#14171b;--ok:#69db7c;--warn:#ffd666;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
a{color:var(--acc)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.loading-screen{min-height:100vh;display:grid;place-items:center;color:var(--mut)}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
.auth-card{width:min(440px,100%);padding:30px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;letter-spacing:-.5px;color:var(--ink);text-decoration:none}
.brand-mark{display:grid;place-items:center;background:var(--acc);color:#fff;width:40px;height:40px;border-radius:12px;font-size:22px}
.brand b{color:var(--acc)}
.muted{color:var(--mut)}
.small{font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:12px;font-weight:750;color:var(--mut)}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{min-width:0;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.field textarea{resize:vertical;min-height:100px;line-height:1.5}
.btn{border:1px solid transparent;border-radius:9px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--acc);color:#fff}
.btn-primary:hover{filter:brightness(.96)}
.btn-soft{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn-soft:hover{border-color:var(--acc)}
.btn-danger{background:transparent;color:#c0392b;border-color:#d9a39b}
.btn-danger:hover{background:rgba(192,57,43,.07)}
.btn-small{padding:7px 10px;font-size:12px}
.btn-block{width:100%}
.error{background:rgba(217,72,15,.08);border:1px solid rgba(217,72,15,.26);color:var(--acc);border-radius:10px;padding:11px 13px;overflow-wrap:anywhere;margin:12px 0}
.notice{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--mut);font-size:13px;margin:12px 0}
.admin-layout{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.sidebar{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px;min-height:100vh;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:0 8px}
.nav-label{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--mut);padding:0 12px;margin-bottom:7px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:var(--mut);border:1px solid transparent;border-radius:10px;padding:11px 12px;font-weight:650}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button.active{background:rgba(217,72,15,.1);border-color:rgba(217,72,15,.18);color:var(--acc)}
.nav-icon{width:22px;text-align:center;font-size:17px}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0}
.side-email{font-size:12px;color:var(--mut);overflow-wrap:anywhere;margin-bottom:10px}
.main{min-width:0}
.topbar{height:74px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(18px,3vw,38px);position:sticky;top:0;z-index:4}
.top-title{font-size:19px;font-weight:800;letter-spacing:-.4px}
.top-actions{display:flex;gap:9px;align-items:center}
.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(217,72,15,.13);color:var(--acc);font-weight:800}
.page{padding:26px clamp(18px,3vw,38px) 48px;max-width:1500px;margin:0 auto}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-heading h1{font-size:clamp(23px,3vw,31px);line-height:1.15;margin:0 0 6px;letter-spacing:-.8px}
.page-heading p{margin:0;color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.stat{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:18px;min-width:0}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:700;gap:8px}
.stat-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:17px}
.stat-value{font-size:clamp(24px,3vw,32px);font-weight:850;letter-spacing:-1px;margin-top:14px;line-height:1.1;overflow-wrap:anywhere}
.stat-note{color:var(--mut);font-size:11px;margin-top:7px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:15px;overflow:hidden}
.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head h2{margin:0;font-size:15px}
.panel-body{padding:18px}
.panel-empty{padding:28px;text-align:center;color:var(--mut)}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:20px}
.quick-card{border:1px solid var(--line);background:var(--card);padding:17px;border-radius:14px;display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink)}
.quick-card:hover{border-color:var(--acc)}
.quick-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(217,72,15,.1);color:var(--acc);font-size:20px;flex:none}
.quick-title{font-weight:750}
.quick-desc{font-size:12px;color:var(--mut);margin-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:17px}
.toolbar .search{flex:1 1 220px}
.toolbar .category-filter{width:165px}
.results-count{font-size:12px;color:var(--mut);margin-left:auto}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:var(--bg);padding:12px 15px;font-weight:800}
td{padding:13px 15px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:hover{background:rgba(128,128,128,.035)}
.product-name{font-weight:750}
.product-sub{font-size:11px;color:var(--mut);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:750;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.stock{background:rgba(43,138,62,.1);color:var(--ok)}
.badge.out{background:rgba(217,72,15,.1);color:var(--acc)}
.badge.status-new{background:rgba(217,72,15,.1);color:var(--acc)}
.badge.status-confirmed{background:rgba(43,138,62,.1);color:var(--ok)}
.badge.status-processing{background:rgba(63,116,184,.12);color:#4778b8}
.badge.status-completed{background:rgba(43,138,62,.1);color:var(--ok)}
.badge.status-cancelled{background:rgba(128,128,128,.13);color:var(--mut)}
.actions{display:flex;gap:6px;align-items:center}
.empty-state{padding:46px 20px;text-align:center;color:var(--mut)}
.empty-symbol{font-size:34px;margin-bottom:8px}
.order-list{display:flex;flex-direction:column;gap:12px}
.order-card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:17px}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.order-ref{font-size:14px;font-weight:850}
.order-date{font-size:11px;color:var(--mut);margin-top:3px}
.order-total{font-size:18px;font-weight:850;letter-spacing:-.3px}
.order-main{display:grid;grid-template-columns:minmax(180px,.9fr) minmax(220px,1.1fr);gap:18px}
.order-customer{font-size:13px;overflow-wrap:anywhere}
.order-customer strong{display:block;font-size:14px;margin-bottom:4px}
.order-customer a{font-weight:650;text-decoration:none}
.order-items{margin:0;padding-left:18px;font-size:12px}
.order-items li{margin:4px 0}
.order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.status-select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:12px}
.modal-root{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:10;align-items:center;justify-content:center;padding:18px}
.modal-root.open{display:flex}
.modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 20px 70px rgba(0,0,0,.22)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:17px;margin:0}
.modal-close{border:0;background:var(--bg);color:var(--mut);width:32px;height:32px;border-radius:8px;font-size:21px}
.modal-body{padding:18px 20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .wide{grid-column:1/-1}
.checkbox-field{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650;margin:12px 0}
.checkbox-field input{width:17px;height:17px;accent-color:var(--acc)}
.modal-footer{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:18px;right:18px;z-index:20;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 15px;box-shadow:var(--shadow);max-width:min(440px,calc(100vw - 36px));font-size:13px}
.hidden{display:none!important}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-layout{grid-template-columns:210px minmax(0,1fr)}.sidebar{padding-left:10px;padding-right:10px}}
@media(max-width:760px){.admin-layout{display:flex;flex-direction:column}.sidebar{position:static;min-height:0;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:12px}.sidebar .brand{padding:0 4px}.side-nav-wrap{display:flex;align-items:center;gap:10px;overflow-x:auto}.side-nav-wrap .nav-label{display:none}.nav{flex-direction:row;gap:5px;min-width:max-content}.nav button{width:auto;padding:9px 11px}.nav button .nav-icon{width:auto}.side-bottom{display:none}.topbar{height:60px;padding:0 16px}.page{padding:21px 14px 35px}.page-heading{align-items:flex-start}.page-heading .btn{white-space:normal}.order-main{grid-template-columns:1fr;gap:12px}.quick-grid{grid-template-columns:1fr}}
@media(max-width:470px){.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:24px}.stat-top{font-size:11px}.top-title{font-size:16px}.top-actions .btn{padding:8px 9px;font-size:12px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.toolbar .category-filter{width:100%}.results-count{width:100%;margin-left:0}.page-heading{flex-direction:column}.order-card{padding:13px}}
</style>
</head>
<body>
<div id="root"><div class="loading-screen">Loading BoltHouse Admin…</div></div>
<div id="modal-root" class="modal-root"></div>
<script src="./config.js?v=5f34b5d"></script>
<script type="module">
import { CFG, api, fetchAll, session, login, logout } from "./api.js";

const $ = id => document.getElementById(id);
const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const money = value => Number(value || 0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) + " EGP";
const pretty = value => String(value || "").replace(/^./, ch => ch.toUpperCase());
const dateText = value => value ? new Date(value).toLocaleString() : "Date unavailable";
const statuses = ["new","confirmed","processing","completed","cancelled"];
const state = { route:"overview", auth:null, products:[], orders:[], settings:null, visibleOrders:[], productSearch:"", productCategory:"all", orderSearch:"", orderStatus:"all", ordersStatusSupported:true, productError:"", ordersError:"", settingsError:"", editing:null, toastTimer:null };

function isAdmin(auth) {
  const meta = auth && auth.user && auth.user.app_metadata ? auth.user.app_metadata : {};
  return meta.role === "admin" || (Array.isArray(meta.roles) && meta.roles.includes("admin"));
}
function statusLabel(value) { return pretty(value || "new"); }
function statusClass(value) { return "status-" + (statuses.includes(value) ? value : "new"); }
function setToast(message) {
  let node = $("toast");
  if (!node) {
    node = document.createElement("div");
    node.id = "toast";
    node.className = "toast";
    document.body.appendChild(node);
  }
  node.textContent = message;
  node.classList.remove("hidden");
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => node.classList.add("hidden"), 3200);
}
function renderLogin(error) {
  $("root").innerHTML = '<main class="auth-wrap"><section class="auth-card"><a class="brand" href="./index.html"><span class="brand-mark">🔩</span><span>Bolt<b>House</b> <span class="muted">Admin</span></span></a><h1 style="font-size:25px;margin:27px 0 6px">Welcome back</h1><p class="muted" style="margin:0 0 20px">Sign in with your administrator account to manage the store.</p>' +
    (error ? '<div class="error" role="alert">' + esc(error) + '</div>' : '') +
    '<form id="login-form"><div class="field"><label for="login-email">EMAIL</label><input id="login-email" type="email" autocomplete="username" required placeholder="you@example.com"></div><div class="field"><label for="login-password">PASSWORD</label><input id="login-password" type="password" autocomplete="current-password" required placeholder="Enter your password"></div><button id="login-submit" class="btn btn-primary btn-block" type="submit" style="margin-top:10px">Sign in to dashboard</button></form><p class="muted small" style="margin:20px 0 0"><a href="./index.html">← Return to storefront</a></p></section></main>';
}
function renderDenied() {
  $("root").innerHTML = '<main class="auth-wrap"><section class="auth-card"><a class="brand" href="./index.html"><span class="brand-mark">🔩</span><span>Bolt<b>House</b> Admin</span></a><h1 style="font-size:24px">Administrator access required</h1><p class="muted">This account is not marked as an administrator. Sign out and use the owner account.</p><button class="btn btn-primary btn-block" data-action="logout">Sign out</button><p><a href="./index.html">Return to storefront</a></p></section></main>';
}
function renderShell() {
  const email = state.auth && state.auth.user && state.auth.user.email ? state.auth.user.email : "Administrator";
  const nav = [{id:"overview",icon:"▦",label:"Overview"},{id:"products",icon:"◇",label:"Products"},{id:"orders",icon:"▤",label:"Orders"},{id:"settings",icon:"⚙",label:"Store settings"}];
  $("root").innerHTML = '<div class="admin-layout"><aside class="sidebar"><a class="brand" href="./index.html"><span class="brand-mark">🔩</span><span>Bolt<b>House</b></span></a><div class="side-nav-wrap"><div><div class="nav-label">WORKSPACE</div><nav class="nav">' +
    nav.map(item => '<button type="button" data-route="' + item.id + '" class="' + (item.id === state.route ? "active" : "") + '"><span class="nav-icon">' + item.icon + '</span><span>' + item.label + '</span></button>').join("") +
    '</nav></div></div><div class="side-bottom"><div class="side-email">Signed in as<br><strong>' + esc(email) + '</strong></div><button class="btn btn-soft btn-block" data-action="logout">↪ Sign out</button><p class="small muted"><a href="./admin-policies.sql" target="_blank" rel="noopener">Admin database setup</a></p></div></aside>' +
    '<main class="main"><header class="topbar"><div><div id="top-title" class="top-title">Overview</div><div class="muted small">BoltHouse store management</div></div><div class="top-actions"><a class="btn btn-soft" href="./index.html">View store ↗</a><div class="avatar">' + esc(String(email).charAt(0).toUpperCase()) + '</div></div></header><div id="page" class="page"><div class="loading-screen">Loading dashboard…</div></div></main></div>';
}
function setPageTitle(title) {
  const node = $("top-title");
  if (node) node.textContent = title;
  document.title = "BoltHouse Admin · " + title;
  document.querySelectorAll("[data-route]").forEach(button => button.classList.toggle("active", button.dataset.route === state.route));
}
async function startApp(auth) {
  state.auth = auth;
  state.route = "overview";
  renderShell();
  await navigate("overview");
}
async function start() {
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
    renderLogin("Supabase is not configured. Check config.js.");
    return;
  }
  const auth = session();
  if (!auth) { renderLogin(""); return; }
  if (!isAdmin(auth)) { renderDenied(); return; }
  await startApp(auth);
}
async function loadProductsData() {
  state.productError = "";
  try {
    const rows = await fetchAll("products?select=category,type,size,length,price,in_stock&order=category,type,size,length");
    state.products = rows;
    return true;
  } catch (error) {
    state.productError = error && error.message ? error.message : "Could not load products.";
    return false;
  }
}
function normalItems(order) {
  if (Array.isArray(order.items)) return order.items;
  if (typeof order.items === "string") {
    try { const parsed = JSON.parse(order.items); return Array.isArray(parsed) ? parsed : []; } catch { return []; }
  }
  return [];
}
async function loadOrdersData() {
  state.ordersError = "";
  state.ordersStatusSupported = true;
  try {
    state.orders = await fetchAll("orders?select=ref,name,phone,address,items,total,created_at,status&order=created_at.desc");
    return true;
  } catch (firstError) {
    try {
      state.orders = await fetchAll("orders?select=ref,name,phone,address,items,total,created_at&order=created_at.desc");
      state.ordersStatusSupported = false;
      return true;
    } catch (error) {
      state.ordersError = error && error.message ? error.message : (firstError && firstError.message ? firstError.message : "Could not load orders.");
      return false;
    }
  }
}
async function navigate(route) {
  if (!["overview","products","orders","settings"].includes(route)) route = "overview";
  state.route = route;
  setPageTitle(route === "overview" ? "Overview" : route === "settings" ? "Store settings" : pretty(route));
  const page = $("page");
  if (!page) return;
  page.innerHTML = '<div class="panel-empty">Loading ' + esc(route) + '…</div>';
  if (route === "overview") {
    await Promise.all([loadProductsData(),loadOrdersData()]);
    renderOverview();
  } else if (route === "products") {
    await loadProductsData();
    renderProducts();
  } else if (route === "orders") {
    await loadOrdersData();
    renderOrders();
  } else {
    await loadSettingsData();
    renderSettings();
  }
}
async function loadSettingsData() {
  state.settingsError = "";
  try {
    const rows = await api("site_settings?select=id,store_name,hero_title,hero_description,perk_one,perk_two,perk_three,whatsapp,updated_at&id=eq.true",{method:"GET"});
    if (!Array.isArray(rows) || !rows.length) throw new Error("No store settings were found. Run the admin database setup SQL to create the settings record.");
    state.settings = rows[0];
    return true;
  } catch (error) {
    state.settingsError = error && error.message ? error.message : "Could not load store settings.";
    state.settings = null;
    return false;
  }
}
function renderSettings() {
  const page = $("page");
  if (!state.settings) {
    page.innerHTML = pageHeading("Store settings","Manage the information customers see on the storefront.") +
      errorBox(state.settingsError) +
      '<section class="panel"><div class="panel-body"><h2 style="margin-top:0">Store settings are not configured</h2><p class="muted">Run the one-time database setup to create secure storage for these settings.</p><a class="btn btn-primary" href="./admin-policies.sql" target="_blank" rel="noopener">Open admin database setup ↗</a></div></section>';
    return;
  }
  const s = state.settings;
  page.innerHTML = pageHeading("Store settings","Edit the storefront branding, homepage message, customer benefits and WhatsApp contact.",'<button class="btn btn-soft" data-action="refresh">↻ Reload</button>') +
    errorBox(state.settingsError) +
    '<section class="panel"><div class="panel-head"><h2>Homepage and contact details</h2><span class="small muted">Saved to the shared database</span></div><div class="panel-body"><form id="settings-form"><div id="settings-form-error"></div><div class="form-grid">' +
    '<div class="field wide"><label for="settings-name">STORE NAME</label><input id="settings-name" name="store_name" maxlength="80" required value="' + esc(s.store_name) + '"></div>' +
    '<div class="field wide"><label for="settings-title">HOMEPAGE HEADLINE</label><input id="settings-title" name="hero_title" maxlength="160" required value="' + esc(s.hero_title) + '"></div>' +
    '<div class="field wide"><label for="settings-description">HOMEPAGE DESCRIPTION</label><textarea id="settings-description" name="hero_description" maxlength="300" required>' + esc(s.hero_description) + '</textarea></div>' +
    '<div class="field"><label for="settings-perk-one">BENEFIT LABEL 1</label><input id="settings-perk-one" name="perk_one" maxlength="60" required value="' + esc(s.perk_one) + '"></div>' +
    '<div class="field"><label for="settings-perk-two">BENEFIT LABEL 2</label><input id="settings-perk-two" name="perk_two" maxlength="60" required value="' + esc(s.perk_two) + '"></div>' +

async function submitProductForm(form) {
  const errorRoot = $("product-form-error");
  const button = $("product-save-button");
  const fd = new FormData(form);
  const category = String(fd.get("category") || "");
  const type = String(fd.get("type") || "").trim();
  const size = Number(fd.get("size"));
  const lengthRaw = String(fd.get("length") || "").trim();
  const price = Number(fd.get("price"));
  const data = {category,type,size,length:lengthRaw === "" ? null : Number(lengthRaw),price,in_stock:fd.get("in_stock") === "on"};
  const old = state.editing;
  if (!["bolt","screw","nut","washer"].includes(category)) { errorRoot.innerHTML = '<div class="error">Choose a valid category.</div>'; return; }
  if (!type || type.length > 80) { errorRoot.innerHTML = '<div class="error">Enter a product type (up to 80 characters).</div>'; $("product-type-field").focus(); return; }
  if (!Number.isSafeInteger(size) || size < 1 || size > 1000) { errorRoot.innerHTML = '<div class="error">Enter a valid metric size.</div>'; $("product-size-field").focus(); return; }
  if (data.length !== null && (!Number.isSafeInteger(data.length) || data.length < 1 || data.length > 10000)) { errorRoot.innerHTML = '<div class="error">Length must be a positive whole number of millimetres, or leave it blank.</div>'; $("product-length-field").focus(); return; }
  if (!Number.isFinite(price) || price < 0 || price > 100000000) { errorRoot.innerHTML = '<div class="error">Enter a valid non-negative price in EGP.</div>'; $("product-price-field").focus(); return; }
  if (state.products.some(p => p !== old && sameProductKey(p,data))) { errorRoot.innerHTML = '<div class="error">A product with this category, type, size, and length already exists.</div>'; return; }
  button.disabled = true;
  button.textContent = old ? "Saving…" : "Creating…";
  errorRoot.innerHTML = "";
  try {
    if (old) {
      await api("products?" + productKey(old),{method:"PATCH",body:data,prefer:"return=minimal"});
    } else {
      await api("products",{method:"POST",body:data,prefer:"return=minimal"});
    }
    closeModal();
    await loadProductsData();
    if (state.route === "overview") renderOverview(); else renderProducts();
    setToast(old ? "Product changes saved." : "Product created.");
  } catch (error) {
    errorRoot.innerHTML = '<div class="error">Could not save product: ' + esc(error && error.message ? error.message : "Unknown error") + '<br><span class="small">If the message mentions permission or 401/403, run the linked admin database setup SQL once in Supabase.</span></div>';
    button.disabled = false;
    button.textContent = old ? "Retry save" : "Retry create";
  }
}
async function deleteProduct(index) {
  const p = state.products[index];
  if (!p) return;
  const label = (p.type || p.category) + " M" + p.size + (p.length == null ? "" : " × " + p.length + " mm");
  if (!window.confirm("Delete " + label + " permanently? This removes it from your catalogue.")) return;
  try {
    await api("products?" + productKey(p),{method:"DELETE",prefer:"return=minimal"});
    await loadProductsData();
    renderProducts();
    setToast("Product deleted.");
  } catch (error) {
    setToast("Could not delete product. Check the admin database setup SQL and try again.");
    console.error(error);
  }
}

async function updateOrderStatus(select) {
  const ref = select.dataset.ref;
  const previous = select.dataset.current || "new";
  const next = select.value;
  if (!ref || !statuses.includes(next)) return;
  select.disabled = true;
  try {
    await api("orders?ref=eq." + encodeURIComponent(ref),{method:"PATCH",body:{status:next},prefer:"return=minimal"});
    const found = state.orders.find(order => String(order.ref) === ref);
    if (found) found.status = next;
    select.dataset.current = next;
    setToast("Order " + ref + " marked " + statusLabel(next).toLowerCase() + ".");
    renderOrderResults();
  } catch (error) {
    select.value = previous;
    select.disabled = false;
    setToast("Could not update order status. Run the admin database setup SQL if needed.");
    console.error(error);
  }

function exportOrders() {
  const rows = state.visibleOrders || [];
  const columns = ["ref","created_at","name","phone","address","total","status","items"];
  const cell = value => '"' + String(value == null ? "" : (typeof value === "object" ? JSON.stringify(value) : value)).replace(/"/g,'""') + '"';
  const csv = [columns.join(","), ...rows.map(order => columns.map(key => cell(order[key])).join(","))].join("\r\n");
  const blob = new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "bolthouse-orders-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  setToast("Orders exported to CSV.");
}

  renderLogin("");
}
document.addEventListener("click", async event => {
  const routeButton = event.target.closest("[data-route]");
  if (routeButton) { await navigate(routeButton.dataset.route); return; }
  const button = event.target.closest("[data-action]");
  if (!button) {
    if (event.target === $("modal-root")) closeModal();
    return;
  }
  const action = button.dataset.action;
  if (action === "logout") { button.disabled = true; await signOut(); }
  else if (action === "refresh") await refreshCurrent();
  else if (action === "add-product") openProductForm(null);
  else if (action === "edit-product") openProductForm(state.products[Number(button.dataset.index)]);
  else if (action === "delete-product") await deleteProduct(Number(button.dataset.index));
  else if (action === "close-modal") closeModal();
  else if (action === "export-orders") exportOrders();
  else if (action === "copy-order") copyOrder(button.dataset.ref || "");
});
document.addEventListener("submit", async event => {
  if (event.target.id === "login-form") {
    event.preventDefault();
    const button = $("login-submit");
    button.disabled = true;
    button.textContent = "Signing in…";
    try {
      const auth = await login($("login-email").value.trim(),$("login-password").value);
      if (!isAdmin(auth)) {
        await logout();
        renderLogin("This account does not have administrator access.");
        return;
      }
      await startApp(auth);
    } catch (error) {
      renderLogin(error && error.message ? error.message : "Sign-in failed. Check your email and password.");
    }
  } else if (event.target.id === "product-form") {
    event.preventDefault();
    await submitProductForm(event.target);
  } else if (event.target.id === "settings-form") {
    event.preventDefault();
    await saveSettingsForm(event.target);
  }
});
document.addEventListener("input", event => {
  if (event.target.id === "product-search") { state.productSearch = event.target.value; renderProductResults(); }
  if (event.target.id === "order-search") { state.orderSearch = event.target.value; renderOrderResults(); }
});
document.addEventListener("change", async event => {
  if (event.target.id === "product-category") { state.productCategory = event.target.value; renderProductResults(); }
  if (event.target.id === "order-status-filter") { state.orderStatus = event.target.value; renderOrderResults(); }
  if (event.target.matches("[data-order-status]")) await updateOrderStatus(event.target);
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("modal-root").classList.contains("open")) closeModal();
});
start();
</script>
</body>
</html>
